server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: room-service
          uri: lb://room-service
          predicates:
            - Path=/api/rooms/**
        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/api/messages/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
        - id: presence-service
          uri: lb://presence-service
          predicates:
            - Path=/api/presence/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL}
  instance:
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN