server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: room-service
          uri: lb://room-service
          predicates:
            - Path=/api/rooms/**
        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/api/messages/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
        - id: presence-service
          uri: lb://presence-service
          predicates:
            - Path=/api/presence/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /api/auth/v3/api-docs
      - name: user-service
        url: /api/users/v3/api-docs

logging:
  level:
    root: INFO
    reactor.netty.http.client: DEBUG
    com.netflix.discovery: DEBUG
    com.netflix.eureka: DEBUG