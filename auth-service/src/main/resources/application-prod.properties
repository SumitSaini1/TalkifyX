server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/auth_db?useSSL=true&requireSSL=true&verifyServerCertificate=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false



spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

eureka.client.serviceUrl.defaultZone=${EUREKA_URL}
eureka.instance.preferIpAddress=false
eureka.instance.hostname=${HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

springdoc.swagger-ui.enabled=false

logging.level.root=WARN
server.error.include-message=never
server.error.include-binding-errors=never
server.forward-headers-strategy=framework
springdoc.api-docs.path=/api/auth/v3/api-docs
