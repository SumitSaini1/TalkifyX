spring.application.name=${APP_NAME:eureka-server}
server.port=${SERVER_PORT:8761}

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

eureka.instance.hostname=${EUREKA_HOST:localhost}
eureka.instance.prefer-ip-address=false

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

eureka.server.enable-self-preservation=true
eureka.server.eviction-interval-timer-in-ms=60000

logging.level.com.netflix.eureka=${EUREKA_LOG_LEVEL:INFO}
eureka.instance.prefer-ip-address=true