server.port=8084

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/message_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka}
eureka.instance.preferIpAddress=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
springdoc.api-docs.path=/api/messages/v3/api-docs
springdoc.swagger-ui.enabled=false

server.forward-headers-strategy=framework

logging.level.root=WARN